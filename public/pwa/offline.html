<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eaf4ff">
  <title>离线 / Offline · LittleApple Start</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; background: #eaf4ff; color: #183047; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { max-width: 34rem; padding: 2rem; }
    h1 { font-size: 1.5rem; }
    p { line-height: 1.7; }
    a { display: inline-block; margin-top: 1rem; padding: .7rem 1rem; color: inherit; border: 1px solid currentColor; border-radius: .7rem; text-decoration: none; }
    @media (prefers-color-scheme: dark) { :root { background: #14202c; color: #eaf4ff; } }
  </style>
</head>
<body>
  <main>
    <h1>LittleApple Start</h1>
    <p>当前无法连接。浏览器中的配置和本地资源仍然保留，联网后可重新打开主页。</p>
    <p lang="en">You are offline. Your settings and local files remain in this browser. Reconnect to open the homepage.</p>
    <a href="/">重新打开 / Try again</a>
  </main>
</body>
</html>
